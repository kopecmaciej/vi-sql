entries:
  - version: 0.4.0
    breaking: true
    title: Connections moved to an XDG state file
    changes:
      - "Breaking: Connections now live in an XDG state file (location is platform-dependent; run vi-sql --paths to see it), not config.yaml. Existing connections migrate automatically on first run, but if you sync config.yaml via git or dotfiles you must now sync the state file as well"
      - "Fix: GaussDB M-mode compatibility"
      - "Fix: Comma is placed before the REQUIRED comment in generated INSERT templates"
      - "Fix: Ctrl+R refresh re-applies the active schema filter immediately"
      - "Fix: Schema nodes keep their expand icon after a Ctrl+R refresh"
  - version: 0.3.0
    breaking: false
    title: GaussDB support, result search, and boolean display fixes
    changes:
      - "New: GaussDB database driver with query, schema browsing, and pagination support"
      - "New: Search through query results with keyboard-driven navigation"
      - "Fix: PostgreSQL and peeker boolean values are displayed consistently"
  - version: 0.2.1
    breaking: false
    title: Query duration in history, master password crash fix, paste with autocomplete
    changes:
      - "New: History modal shows how long each query took to run"
      - "Fix: No more crash after entering the master password when the focus stack is empty"
      - "Fix: Pasting text while autocomplete is active works correctly"
  - version: 0.2.0
    breaking: false
    title: Oracle driver, focus stack fix, config lifecycle improvements
    changes:
      - "New: Oracle database driver with full query, schema browsing, and pagination support"
      - "Fix: Closing the value viewer inside a peeker modal now correctly restores focus to the peeker"
      - "Fix: Cancelling the options page no longer overwrites the active config"
      - "Fix: Manager shutdown now uses sync.Once to prevent panics on rapid shutdown"
  - version: 0.1.4
    breaking: false
    title: SQL formatting, error modal copy, escaping connection/options pages
    changes:
      - "New: Format the query in the editor in place with `gf` (vim) or `Ctrl+f` (normal), also available from the actions modal"
      - "New: Error modal now has a button to copy the error text to the clipboard"
      - "Fix: Autocomplete for columns, schemas, and tables now behaves correctly when the cursor is inside quotes"
      - "Fix: Focus is restored correctly after a failed row delete"
      - "Fix: Exiting the connection or options page no longer wipes the active session"
  - version: 0.1.3
    breaking: false
    title: Views in schema tree, XLSX export, dialect-aware autocomplete, Windows support
    changes:
      - "New: Views now appear in the schema tree; opening a view shows its data and structure"
      - "New: XLSX export option added to the export modal"
      - "New: Autocomplete quotes identifiers using the correct syntax per backend (Postgres/SQLite: `\"`, MySQL: `` ` ``, SQL Server: `[]`)"
      - "New: Windows PowerShell install script; log path defaults to OS temp directory on all platforms"
      - "Fix: Opening a table or query that already has an open tab now focuses the existing tab instead of creating a duplicate"
      - "Fix: Copy as JSON now correctly formats nested JSON values"
  - version: 0.1.2
    breaking: false
    title: Copy row as JSON/CSV, longer key sequences, paste fix
    changes:
      - "New: Copy row as JSON or CSV — `yrj` / `yrc` in vim mode, `Alt+j` / `Alt+c` in normal mode; also available from the actions modal"
      - "New: Keybinding sequences now accept two or more runes, enabling chords like `yrj`"
      - "New: `--config` accepts a directory path and resolves to `config.yaml` inside it"
      - "Fix: Bracketed-paste input from the terminal now works correctly"
      - "Improvement: Confirm key defaults to `Ctrl+s` in both modes (was `Ctrl+Enter` in normal mode, which doesn't register in some terminals)"
